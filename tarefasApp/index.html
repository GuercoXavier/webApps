<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minhas Tarefas</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <section class="tarefas-container">
      <h1>Minhas Tarefas</h1>

      <div class="tasks" id="allTasks">
        <!-- Buttons -->
        <button id="addTarefa">Adicionar Tarefa</button>
        <button id="removerTarefa">Remover Tarefa</button>

        <!-- Input fields -->
        <div class="inputs">
          <p>Name</p>
          <input type="text" id="nameField" />
          <p>Description</p>
          <input type="text" id="descField" />
        </div>

        <div class="task">
          <p id="name">Tarefa 1</p>
          <p id="description">blablablablalbla</p>
        </div>
      </div>
    </section>
  </body>
  <script src="app.js"></script>
</html>
